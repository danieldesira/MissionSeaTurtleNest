<pretty-dialog id="scoresDialog">
  <span slot="title">Scores</span>
  <div slot="content">
    <div class="flex flex-col gap-4 text-primary">
      <section class="flex flex-col gap-1">
        <h3 class="font-bold text-xl">Personal Best</h3>
        <div class="flex gap-1">
          <div class="flex flex-col gap-1">
            <span class="font-bold text-lg">Level:</span>
            <span
              id="personalBestLevel"
              class="font-semibold text-md italic"
            ></span>
          </div>
          <div class="flex flex-col gap-1">
            <span class="font-bold text-lg">Points</span>
            <span
              id="personalBestPoints"
              class="font-semibold text-md italic"
            ></span>
          </div>
          <div class="flex flex-col gap-1">
            <span class="font-bold text-lg">Duration:</span>
            <span
              id="personalBestDuration"
              class="font-semibold text-md italic"
            ></span>
          </div>
          <div class="flex flex-col gap-1">
            <span class="font-bold text-lg">Outcome:</span>
            <span
              id="personalBestOutcome"
              class="font-semibold text-md italic"
            ></span>
          </div>
        </div>
      </section>
      <section id="leaderboard" class="hidden flex-col gap-1">
        <h3 class="font-bold text-xl">Leaderboard</h3>
        <table class="table">
          <thead>
            <tr>
              <th></th>
              <th class="font-bold text-lg px-1">Player</th>
              <th class="font-bold text-lg px-1">Level</th>
              <th class="font-bold text-lg px-1">Points</th>
              <th class="font-bold text-lg px-1">Outcome</th>
              <th class="font-bold text-lg px-1">Duration</th>
            </tr>
          </thead>
          <tbody id="leaderboardTbody"></tbody>
        </table>
      </section>
      <span id="loadingLeaderboard" class="text-sm font-bold italic">
        Loading leaderboard...
      </span>
    </div>
  </div>
  <div slot="footer">
    <pretty-button id="closeScoresBtn">Close</pretty-button>
  </div>
</pretty-dialog>

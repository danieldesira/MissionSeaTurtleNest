<pretty-dialog id="loginInvitationDialog">
  <span slot="title">Please Consider Logging-in</span>
  <div slot="content" class="flex flex-col items-center justify-center gap-2">
    As a guest user, you will lose any game progress. Do you wish to login? It
    should only take a few seconds.
  </div>
  <div slot="footer" class="flex items-center justify-center gap-2">
    <pretty-button
      id="loginInvitationBtn"
      dialog-target="loginInvitationDialog"
      dialog-action="close"
    >
      Login
    </pretty-button>
    <pretty-button
      id="closeLoginInvitationBtn"
      variant="danger"
      dialog-target="loginInvitationDialog"
      dialog-action="close"
    >
      Dismiss
    </pretty-button>
  </div>
</pretty-dialog>

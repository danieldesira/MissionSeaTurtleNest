<pretty-dialog id="settingsDialog">
  <span slot="title">Settings</span>
  <div slot="content">
    <div class="flex flex-col gap-4">
      <div class="flex gap-1">
        <tab-pill name="settings" data-container="profile-tab" data-active>
          Profile
        </tab-pill>
        <tab-pill name="settings" data-container="controls-tab">
          Controls
        </tab-pill>
      </div>
      <div class="pt-2 border-t-2 border-t-solid border-t-primary">
        <form id="settingsForm" method="dialog">
          <tab-container id="profile-tab">
            <span
              id="playerEmailReadonlyField"
              class="font-semibold text-xl text-primary"
            ></span>
            <div class="flex flex-col gap-1">
              <image-uploader id="profilePicUploader">
                Profile Picture
              </image-uploader>
              <text-input id="playerNameInput">Name</text-input>
              <text-input id="playerDobInput" type="date">
                Date of Birth
              </text-input>
            </div>
          </tab-container>
          <tab-container id="controls-tab">
            <form-field id="screenControlPositionRadio">
              <span slot="label">Screen Controls Position</span>
              <div slot="field">
                <input
                  type="radio"
                  id="controlLeft"
                  class="appearance-none w-4 h-4 border-primary border-solid border-2 rounded-sm checked:bg-primary focus:ring-2 focus:ring-primary px-2 py-1"
                  name="screenControlPositionRadio"
                  value="Left"
                />
                <label for="controlLeft" role="button">Left</label>
                <input
                  type="radio"
                  id="controlRight"
                  class="appearance-none w-4 h-4 border-primary border-solid border-2 rounded-sm checked:bg-primary focus:ring-2 focus:ring-primary px-2 py-1"
                  name="screenControlPositionRadio"
                  value="Right"
                />
                <label for="controlRight" role="button">Right</label>
              </div>
            </form-field>
            <form-field>
              <span slot="label" for="volumeRangeInput">Audio Volume</span>
              <input
                id="volumeRangeInput"
                slot="field"
                class="accent-primary"
                type="range"
                min="0"
                max="1"
                step="0.1"
              />
            </form-field>
          </tab-container>
        </form>
      </div>
    </div>
  </div>
  <div slot="footer">
    <pretty-button
      id="closeSettingsBtn"
      dialog-target="settingsDialog"
      dialog-action="close"
    >
      Close
    </pretty-button>
  </div>
</pretty-dialog>

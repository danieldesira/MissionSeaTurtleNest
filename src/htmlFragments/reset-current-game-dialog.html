<pretty-dialog id="resetCurrentGameDialog">
  <span slot="title">Game reset</span>
  <div slot="content">
    Your turtle died, so the game have been reset from the start of the current
    level.
    <span id="remainingGameResets"></span> resets remaining!
  </div>
  <div slot="footer" class="flex items-center justify-center gap-2">
    <pretty-button
      id="closeResetCurrentGameDialog"
      dialog-target="resetCurrentGameDialog"
      dialog-action="close"
    >
      Close
    </pretty-button>
  </div>
</pretty-dialog>

<dialog
  id="assetLoadingOverlay"
  closedby="none"
  class="fixed inset-0 flex-col justify-center items-center p-0 m-0 w-full h-full bg-slate-950 bg-opacity-95 border-none z-50 max-h-none max-w-none touch-none"
>
  <i class="text-primary animate-bounce h-10 w-10" data-lucide="turtle"></i>
  <span
    id="assetLoadingOverlayText"
    class="text-primary text-3xl font-bold"
  ></span>
  <progress
    id="assetLoadingProgressBar"
    class="w-3/4 mt-4 accent-primary"
    value="0"
    max="100"
  ></progress>
</dialog>

<pretty-dialog id="gamePausedDialog">
  <span slot="title">Game Paused</span>
  <div slot="content">
    Game paused. Click the <strong>Resume</strong> button to continue.
  </div>
  <div slot="footer">
    <pretty-button
      id="resumeBtn"
      dialog-target="gamePausedDialog"
      dialog-action="close"
    >
      Resume
    </pretty-button>
  </div>
</pretty-dialog>

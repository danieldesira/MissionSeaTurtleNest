<template id="gameGaugeTemplate">
  <style>
    @reference "./src/main.css";

    .outerContainer {
      @apply flex flex-col gap-1;
    }

    .label {
      @apply flex gap-2 items-center text-primary font-semibold text-lg;
    }

    meter {
      accent-color: var(--color-primary);
    }

    meter::-webkit-meter-bar {
      @apply bg-slate-800 rounded-sm;
    }

    meter::-webkit-meter-optimum-value {
      @apply bg-primary rounded-sm;
    }

    meter::-webkit-meter-suboptimum-value {
      @apply bg-primary rounded-sm;
    }

    meter::-webkit-meter-even-less-good-value {
      @apply bg-danger rounded-sm;
    }
  </style>
  <div class="outerContainer">
    <div class="label"><slot name="icon"></slot><slot name="label"></slot></div>
    <meter max="100" min="0" low="30" value="100" title="100%"></meter>
  </div>
</template>

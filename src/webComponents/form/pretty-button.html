<template id="prettyButtonTemplate">
  <style>
    @reference "./src/main.css";

    button {
      @apply rounded-full text-sm px-2 py-1 w-fit cursor-pointer transition-colors duration-500 bg-transparent border border-solid hover:text-white;
    }

    .default {
      @apply border-primary text-primary hover:bg-primary;
    }

    .danger {
      @apply border-danger text-danger hover:bg-danger;
    }
  </style>
  <button type="button" role="button">
    <slot></slot>
  </button>
</template>
